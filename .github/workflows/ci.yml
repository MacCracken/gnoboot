name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Mirrors agnos's CI install pattern (canonical install.sh +
        # post-install smoke). Without the smoke test, a silent install
        # failure cascades into misleading errors in downstream steps
        # (e.g. `cyrius build` reporting our source as broken when in
        # fact `cyrius` is just `command not found`).
        run: |
          set -e
          export CYRIUS_VERSION="$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/install.sh" | sh
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV
          "$HOME/.cyrius/bin/cyrius" --version || {
            echo "FAIL: cyrius toolchain install did not produce a working binary"
            echo "  expected version: $CYRIUS_VERSION"
            echo "  installed contents:"
            ls -la "$HOME/.cyrius/bin/" 2>/dev/null || echo "  (no $HOME/.cyrius/bin/ — install never ran)"
            exit 1
          }

      - name: Build (UEFI Application)
        run: |
          mkdir -p build
          CYRIUS_TARGET_EFI=1 cyrius build src/main.cyr build/BOOTX64.EFI
          echo "build/BOOTX64.EFI: $(wc -c < build/BOOTX64.EFI) bytes"
          file build/BOOTX64.EFI

      - name: Structural gate (PE32+ EFI Application)
        # Fast structural check on the binary's PE header — independent
        # of OVMF runtime. Verifies Subsystem=0xA, NX_COMPAT, no
        # RELOCS_STRIPPED. Catches cyrius emit regressions quickly.
        run: sh tests/verify_pe.sh

      - name: Install OVMF + disk-image tooling
        # Ubuntu's `ovmf` package supplies the OVMF firmware files;
        # `parted` + `mtools` build the GPT-disk-with-ESP layout that
        # OVMF requires for the removable-boot path to resolve
        # `\EFI\BOOT\BOOTX64.EFI`. `qemu-system-x86` provides
        # qemu-system-x86_64.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ovmf parted mtools qemu-system-x86

      - name: Fetch agnos kernel (pinned in tests/AGNOS_VERSION)
        # The boot gates need a real ELF64: the 4-byte stub fails before
        # the handoff banner prints. Exported as AGNOS_KERNEL, which all
        # three gates read.
        run: |
          kernel="$(sh tests/fetch_agnos.sh)"
          echo "AGNOS_KERNEL=$kernel" >> "$GITHUB_ENV"

      - name: OVMF smoke (banner on ConOut)
        # End-to-end gate: builds a GPT disk with ESP, drops in
        # BOOTX64.EFI, boots under qemu + OVMF, asserts the expected
        # banner appears on the firmware ConOut serial. A gate that
        # cannot run exits 77, which fails this step.
        run: sh tests/ovmf_smoke.sh

      - name: Malformed-kernel gate (v0.7.0 hardening)
        # Boots 18 deliberately-corrupted \boot\agnos images under OVMF
        # and asserts each one fails to its specific 4-char code BEFORE
        # ExitBootServices. Without this, every bounds check added at
        # v0.7.0 is unexercised code, and an unexercised check is
        # indistinguishable from an absent one — verify_pe.sh and
        # ovmf_smoke.sh both test only the happy path.
        run: sh tests/malformed_kernel.sh

      - name: Multi-PT_LOAD gate
        # Splits the real kernel's single PT_LOAD into two contiguous
        # ones describing an identical memory layout, and asserts it
        # boots equivalently. Its marker takes ~8s on a fast host, about
        # a third of the local default, so CI gets a longer deadline.
        # QEMU always runs to the deadline: this step costs 2 minutes.
        env:
          QEMU_TIMEOUT: "60"
        run: sh tests/multi_ptload.sh

      - name: Pre-EBS hardening gate (v0.9.0)
        # Forces the memory-map sanity failure, and builds copies of the
        # source that corrupt boot_info and outgrow the old 16 KB map
        # buffer. QEMU always runs to the deadline: about 100 seconds.
        run: sh tests/pre_ebs.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnoboot-BOOTX64.EFI
          path: build/BOOTX64.EFI
          retention-days: 14
